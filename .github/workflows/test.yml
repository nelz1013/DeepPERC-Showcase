name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Quickstart
        run: deepperc esd-window examples/esd_fixture.cir --pads examples/esd_fixture_pads.toml --limits examples/esd_fixture_limits.csv; test $? -eq 1
